  title: '\(\texttt{hls4ml}\): An Open-Source Codesign Workflow to Empower Scientific Low-Power Machine
    Learning Devices'
  image: slider.png
  image_width: 500
  abstract: >-
    To support domain scientists, we have developed \(\texttt{hls4ml}\), an open-source software-hardware
    codesign workflow to interpret and translate machine learning algorithms for implementation with both
    FPGA and ASIC technologies. We expand on previous \(\texttt{hls4ml}\) work by extending capabilities
    and techniques towards low-power implementations and increased usability: new Python APIs, quantization-aware
    pruning, end-to-end FPGA workflows, long pipeline kernels for low power, and new device backends include
    an ASIC workflow. Taken together, these and continued efforts in \(\texttt{hls4ml}\) will arm a new
    generation of domain scientists with accessible, efficient, and powerful tools for machine-learning-accelerated
    discovery.
