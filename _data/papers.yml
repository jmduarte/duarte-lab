- doi: 10.1140/epjc/s10052-020-7608-4
  title: 'JEDI-net: a jet identification algorithm based on interaction networks'
  image: graph_white.jpg
  image_width: 500
  abstract: >-
    We investigate the performance of a jet identification algorithm based on interaction networks (JEDI-net)
    to identify all-hadronic decays of high-momentum heavy particles produced at the LHC and distinguish
    them from ordinary jets originating from the hadronization of quarks and gluons. The jet dynamics
    are described as a set of one-to-one interactions between the jet constituents. Based on a representation
    learned from these interactions, the jet is associated to one of the considered categories. The presented
    models give better results with less model parameters than other traditional architectures.
