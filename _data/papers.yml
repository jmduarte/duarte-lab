# Research entries for research.html.
#
# To add a paper: append an entry with `arxiv:` (or `doi:`), an `image:`
# from images/, and its links. Then run:
#
#     python3 scripts/fetch_papers.py
#
# which fills in any missing `title:`/`abstract:` from INSPIRE-HEP and
# converts $...$ math to the \( ... \) delimiters MathJax is configured for.
# Existing `title:`/`abstract:` values are never overwritten -- several here
# are deliberately trimmed versions of the official abstract.
#
# Order matters: entries render newest-first, and everything after the
# first `collapse_after` (see research.html) is hidden behind the toggle.
- arxiv: '2611.00234'
  title: Localized anomaly detection with a calorimeter normalizing flow
  image: calo_flow_anomaly_map.png
  image_width: 500
  abstract: >-
    Normalizing flows trained as fast calorimeter simulators also give the likelihood of each shower,
    which can serve as an anomaly score. Because this likelihood sums over every voxel, a signal confined
    to a few voxels can be lost in the fluctuations of the rest of the shower. For example, in a public
    benchmark dataset in which a long-lived neutral particle decays to two photons, the CaloFlow likelihood
    used in previous work selects less than 5% of the signal at a background efficiency of \(10^{-3}\)
    when the particle has the largest simulated mass and decays at or just behind the front face of the
    calorimeter. In this work, we define a regional anomaly score by summing the squared latent coordinates
    of the same flow within small detector regions around the point where the particle enters the calorimeter,
    with the threshold set using background showers alone. At the same background efficiency, this regional
    anomaly score selects more than 95% of the signal. The per-coordinate likelihood terms, summed over
    the same regions, perform equally well, but the squared latent coordinates have a known distribution
    for background showers and clearly illustrate when a shower departs from it. Therefore, normalizing
    flows may be sensitive to new physics, even if the global likelihood is not.
  links:
  - label: Paper
    url: https://arxiv.org/abs/2611.00234
    text: arXiv:2611.00234
- arxiv: '2610.15919'
  title: 'RINO: Renormalization Group Distillation with No Labels'
  image: rino_diagram.png
  image_width: 500
  abstract: >-
    Supervised machine learning in high-energy physics (HEP) requires training on labeled simulations
    of particle collisions, which are known to be unfaithful to the underlying physics. This leads to
    significant inaccuracies and biases in the transfer of trained models to real data, limiting the power
    of deep learning methods. Self-supervised learning (SSL) is a promising alternative for pretraining
    directly on real, unlabeled data. However, existing techniques largely operate with inductive biases
    inspired by domains such as images and natural language. We propose RINO (Renormalization Group DIstillation
    with NO Labels), which, for the first time, exploits the fundamentally multi-scale renormalization
    group structure of high-energy jet formation as a physically grounded source of SSL views. We define
    teacher-student representations across energy scales using different levels of hierarchical clustering,
    aligned via DINO-style self-distillation. To mirror the background-dominated nature of real collider
    data, RINO pretrains exclusively on jets from quantum chromodynamics (QCD) processes and is evaluated
    on out-of-distribution (OOD) transfer to rare signal classes. In our controlled data-efficiency study,
    RINO matches fully supervised training on JetNet after finetuning on only 1% of the labeled data.
    With the full labeled dataset, RINO improves OOD classification accuracy on top-quark jets by 5.9%
    and, without retraining, improves AUC on the unseen Higgs boson decay channel \(H \to 4q\) by 4.1%
    over the strongest SSL baseline. Scale-structure diagnostics reveal that DINO-style self-distillation
    permits our backbone to retain scale-dependent structure. Ablation studies show that this accounts
    for an 8.6% OOD accuracy gap with respect to alternative SSL paradigms such as SimCLR. Code is available
    at https://github.com/zichunhao/RINO.
  links:
  - label: Paper
    url: https://arxiv.org/abs/2610.15919
    text: arXiv:2610.15919
  - label: Preliminary version
    url: https://arxiv.org/abs/2509.07486
    text: arXiv:2509.07486 (ML4PS Workshop at NeurIPS 2025)
  - label: Code
    url: https://github.com/zichunhao/RINO
    text: https://github.com/zichunhao/RINO
- arxiv: '2607.05145'
  title: Search for nonresonant triple Higgs boson production in the final state with six bottom quarks
    in proton-proton collisions at \(\sqrt{s}\) = 13 TeV
  image: CMS-HIG-24-012_Figure_002-b.png
  image_width: 500
  abstract: >-
    A search for nonresonant triple Higgs boson (HHH) production in the final state with six bottom quarks
    is performed using proton-proton collisions at \(\sqrt{s}\) = 13 TeV corresponding to an integrated
    luminosity of 138 fb\(^{-1}\) recorded by the CMS experiment. No significant excess of events over
    the background prediction is seen. Observed (expected) 95% confidence level upper limits on the signal
    cross section are set at 44 (43) fb, corresponding to 588 (572) times the standard model expectation.
    The observed (expected) constraint on the trilinear coupling modifier \(\kappa_3\) is \(-\)7.4 \(\lt\)
    \(\kappa_3\) \(\lt\) 12.4 (\(-\)6.4 \(\lt\) \(\kappa_3\) \(\lt\) 11.2), assuming the quartic coupling
    modifier \(\kappa_4\) = 1. The corresponding constraint on \(\kappa_4\) is \(-\)177 \(\lt\) \(\kappa_4\)
    \(\lt\) 185 (\(-\)180 \(\lt\) \(\kappa_4\) \(\lt\) 190), assuming \(\kappa_3\) = 1. This analysis
    provides the most stringent constraint to date on nonresonant HHH production and excludes, for the
    first time, part of the \((\kappa_3,\kappa_4)\) space allowed by the perturbative unitarity bound.
  links:
  - label: Paper
    url: https://arxiv.org/abs/2607.05145
    text: arXiv:2607.05145
  - label: Figures
    url: https://cms-results.web.cern.ch/cms-results/public-results/publications/HIG-24-012/
