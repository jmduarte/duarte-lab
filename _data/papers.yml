- title: Particle Cloud Generation with Message Passing Generative Adversarial Networks
  image: mpgan_mass.png
  image_width: 500
  abstract: >-
    In high energy physics (HEP), jets are collections of correlated particles produced ubiquitously in
    particle collisions such as those at the CERN Large Hadron Collider (LHC). Machine-learning-based
    generative models, such as generative adversarial networks (GANs), have the potential to significantly
    accelerate LHC jet simulations. Despite jets having a natural representation as a set of particles
    in momentum-space, a.k.a. a particle cloud, there exist no generative models for such a dataset. We
    introduce a new particle cloud dataset (JetNet), and apply existing point cloud GANs to it. Existing
    GANs are found to be inadequate for physics applications, hence we develop a new message passing GAN
    (MPGAN), which outperforms existing point cloud GANs. We propose JetNet as a novel point-cloud-style
    dataset for the machine learning community to experiment with, and set MPGAN as a benchmark to improve
    upon for future generative models.
