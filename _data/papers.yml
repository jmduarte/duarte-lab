- arxiv: '2408.09343'
  title: Large-Scale Pretraining and Finetuning for Efficient Jet Classification in Particle Physics
  image: rej_pretrained_vs_from_scratch-2.png
  image_width: 500
  abstract: >-
    Faced with the increasing computational cost of producing high-quality labeled simulation samples
    at the CERN LHC, we propose leveraging large volumes of unlabeled data to overcome the limitations
    of supervised learning methods, which heavily rely on detailed labeled simulations. By pretraining
    models on these vast, mostly untapped datasets, we aim to learn generic representations that can be
    finetuned with smaller quantities of labeled data. Our methodology employs contrastive learning with
    augmentations on jet datasets to teach the model to recognize common representations of jets, addressing
    the unique challenges of LHC physics. We showcase the scalability and effectiveness of our models
    by gradually increasing the size of the pretraining dataset and assessing the resultant performance
    enhancements. Our results, obtained from experiments on two datasets---JetClass, representing unlabeled
    data, and Top Tagging, serving as labeled simulation data---show significant improvements in data
    efficiency, computational efficiency, and overall performance.
