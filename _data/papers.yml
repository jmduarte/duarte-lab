- title: Search for highly energetic double Higgs boson production in the two bottom quark and two vector
    boson all-hadronic final state
  image: HIG-23-012_1.png
  image_width: 500
  abstract: >-
    A search for standard model (SM) nonresonant Higgs boson pair (\(\mathrm{HH}\)) production is performed
    in the two bottom quark (\(\mathrm{b\overline{b}}\)) and all-hadronic two vector boson (\(\mathrm{VV}\to\mathrm{4q}\))
    final states. The search is carried out in proton-proton collisions at \(13\,\mathrm{TeV}\) with a
    data set corresponding to a total luminosity of \(138\,\mathrm{fb}^{-1}\). It selects for highly Lorentz-boosted
    HH events, where each Higgs boson's daughter quarks are all merged inside a single anti-\(k_\mathrm{T}\)
    \(R = 0.8\) jet and introduces the new global particle transformer (GloParT) classifier to effectively
    perform boosted \(\mathrm{VV}\to\mathrm{4q}\) jet identification. The multiplicative modifier of the
    SM quartic coupling between two Higgs bosons and two vector bosons is observed (expected) to be constrained
    at \(95\%\) confidence level to \(\kappa_\mathrm{2V} \in [-0.04, 2.05]\) (\([0.05, 1.98]\)).
