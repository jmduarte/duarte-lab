- doi: 10.1007/s41781-019-0027-2
  title: FPGA-accelerated machine learning inference as a service for particle physics computing
  image: sonic.jpg
  image_width: 500
  abstract: >-
    We demonstrate that the acceleration of machine learning inference as a service represents a nondisruptive,
    heterogeneous computing solution for particle physics experiments. We retrain the ResNet-50 convolutional
    neural network to achieve state-of-the-art performance for top quark jet tagging at the LHC and apply
    a ResNet-50 model with transfer learning for neutrino event classification. Using Project Brainwave
    by Microsoft to accelerate the ResNet-50 image classification model, we achieve average inference
    times of 60 (10) milliseconds with our experimental physics software framework using Brainwave as
    a cloud (edge or on-premises) service, and a maximum throughput of 600-700 inferences per second.
  links:
