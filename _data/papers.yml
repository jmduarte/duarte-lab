- doi: 10.1007/JHEP03(2022)160
  title: Search for Higgs boson decays into long-lived particles in associated Z boson production
  image: EXO-20-003_overlay.png
  image_width: 500
  abstract: >-
    We present a search for long-lived particles (LLPs) produced in association with a Z boson. The search
    is performed with data from 13 TeV proton-proton collisions recorded by the CMS experiment during
    2016-2018, corresponding to an integrated luminosity of 117 fb\(^{-1}\). The LLPs are assumed to decay
    into a pair of standard model fermions inside the tracker volume, which results in displaced jets.
    A trigger and selections based on Z boson decays to electron or muon pairs provide sensitivity to
    light (15 GeV or less) LLPs, which have up to now been difficult to access. Decays of LLPs are selected
    by requiring the presence of displaced jets which are identified using information from the CMS tracking
    system. The results are interpreted in the context of exotic decays of the Higgs boson to LLPs (H\(\to\)SS).
    The search is sensitive to branching fractions \(\mathcal{B}\)(H\(\to\)SS) of 4-5% (less than 20%)
    for LLP masses of 40 (15) GeV and mean proper decay lengths of 10-100 mm (10-50 mm).
