  title: Compressing deep neural networks on FPGAs to binary and ternary precision with \(\texttt{hls4ml}\)
  image: binary_ternary_architecture.png
  image_width: 500
  abstract: >-
    We present the implementation of binary and ternary neural networks in the \(\texttt{hls4ml}\) library,
    designed to automatically convert deep neural network models to digital circuits with FPGA firmware.
    We investigate different strategies to reduce networks' resource consumption by reducing the numerical
    precision of the network parameters to binary or ternary. We discuss the trade-off between model accuracy
    and resource consumption. In addition, we show how to balance between latency and accuracy by retaining
    full precision on a selected subset of network components. As examples, we consider two multiclass
    classification tasks: handwritten digit recognition with the MNIST data set and jet identification
    with simulated proton-proton collisions at the CERN Large Hadron Collider. The binary and ternary
    implementation has similar performance to the higher precision implementation while using drastically
    fewer FPGA resources.
