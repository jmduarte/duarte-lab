  title: Autoencoders on FPGAs for real-time, unsupervised new physics detection at 40 MHz at the Large
    Hadron Collider
  image: cnn_arch_with_lines.png
  image_width: 500
  abstract: >-
    We show how to adapt and deploy anomaly detection algorithms based on deep autoencoders, for the unsupervised
    detection of new physics signatures in the extremely challenging environment of a real-time event
    selection system at the Large Hadron Collider (LHC). We demonstrate that new physics signatures can
    be enhanced by three orders of magnitude, while staying within the strict latency and resource constraints
    of a typical LHC event filtering system. In particular, anomaly detection can be performed in as little
