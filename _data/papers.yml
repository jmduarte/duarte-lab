    url: https://doi.org/10.1088/2632-2153/adede1
    text: 'Mach. Learn.: Sci. Technol. 6, 035009 (2025)'
- arxiv: '2412.03819'
  doi: 10.1007/JHEP11(2025)119
  title: Reconstruction of boosted and resolved multi-Higgs-boson events with symmetry-preserving attention
    networks
  image: Di-Higgs.png
  image_width: 500
  abstract: >-
    The production of multiple Higgs bosons at the CERN LHC provides a direct way to measure the trilinear
    and quartic Higgs self-interaction strengths as well as potential access to beyond the standard model
    effects that can enhance production at large transverse momentum \(p_\mathrm{T}\). The largest event
    fraction arises from the fully hadronic final state in which every Higgs boson decays to a bottom
    quark-antiquark pair (\(b\overline{b}\)). This introduces a combinatorial challenge known as the <i>jet
    assignment problem</i>: assigning jets to sets representing Higgs boson candidates. Symmetry-preserving
    attention networks (SPA-Nets) have been developed to address this challenge. However, the complexity
    of jet assignment increases when simultaneously considering both \(H\to b\overline{b}\) reconstruction
    possibilities, i.e., two "resolved" small-radius jets each containing a shower initiated by a \(b\)
    quark or one "boosted" large-radius jet containing a merged shower initiated by a (\(b\overline{b}\))
    pair. The latter improves the reconstruction efficiency at high \(p_\mathrm{T}\). In this work, we
    introduce a generalization to the SPA-Net approach to simultaneously consider both boosted and resolved
    reconstruction possibilities and unambiguously interpret an event as "fully resolved", "fully boosted",
    or in between. We report the performance of baseline methods, the original SPA-Net approach, and our
    generalized version on nonresonant \(HH\) and \(HHH\) production at the LHC.
