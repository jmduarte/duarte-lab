- doi: 10.1088/1748-0221/13/07/P07027
  title: Fast inference of deep neural networks in FPGAs for particle physics
  image: flow-hls4ml.jpg
  image_width: 500
  abstract: >-
    We develop a package based on high-level Synthesis (HLS) called \(\texttt{hls4ml}\) to build machine
    learning models in FPGAs for extremely low-latency applications (less than one microsecond). The use
    of HLS increases accessibility across a broad user community and allows for a drastic decrease in
    firmware development time. We map out FPGA resource usage and latency versus neural network hyperparameters
    to identify the problems in particle physics that would benefit from performing neural network inference
    with FPGAs. For a case study jet substructure model, we fit well within the available resources of
    modern FPGAs with a latency on the scale of 100 ns.
