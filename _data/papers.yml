- doi: 10.1109/TNS.2021.3087100
  title: A reconfigurable neural network ASIC for detector front-end data compression at the HL-LHC
  image: Autoencoder.png
  image_width: 500
  abstract: >-
    Despite advances in the programmable logic capabilities of modern trigger systems, a significant bottleneck
    remains in the amount of data to be transported from the detector to off-detector logic where trigger
    decisions are made. We demonstrate that a neural network autoencoder model can be implemented in a
    radiation tolerant ASIC to perform lossy data compression alleviating the data transmission problem
    while preserving critical information of the detector energy profile. For our application, we consider
    the high-granularity calorimeter from the CMS experiment at the CERN Large Hadron Collider. The advantage
    of the machine learning approach is in the flexibility and configurability of the algorithm. By changing
    the neural network weights, a unique data compression algorithm can be deployed for each sensor in
    different detector regions, and changing detector or collider conditions. To meet area, performance,
    and power constraints, we perform a quantization-aware training to create an optimized neural network
    hardware implementation. The design is achieved through the use of high-level synthesis tools and
    the \(\texttt{hls4ml}\) framework, and was processed through synthesis and physical layout flows based
    on a LP CMOS 65 nm technology node. The flow anticipates 200 Mrad of ionizing radiation to select
    gates, and reports a total area of 3.6 mm^2 and consumes 95 mW of power. The simulated energy consumption
    per inference is 2.4 nJ. This is the first radiation tolerant on-detector ASIC implementation of a
    neural network that has been designed for particle physics applications.
  links:
  - label: Paper
    url: https://doi.org/10.1109/TNS.2021.3087100
    text: IEEE Trans. Nucl. Sci., 1 (2021)
- doi: 10.1007/s41781-021-00073-z
  title: Charged particle tracking via edge-classifying interaction networks
  image: train_classified_edges.png
  image_width: 500
  abstract: >-
    Tracker events are naturally represented as graphs by identifying hits as nodes and track segments
    as edges; given a set of hypothesized edges, edge-classifying graph neural networks (GNNs) predict
    which correspond to real track segments. In this work, we adapt the physics-motivated interaction
    network (IN) to the problem of charged-particle tracking in the high-pileup conditions expected at
    the HL-LHC. We demonstrate its excellent edge-classification accuracy and tracking efficiency through
    a suite of measurements at each stage of GNN-based tracking: graph construction, edge classification,
    and track building. The proposed IN architecture is substantially smaller than previously studied
    GNN tracking architectures, a reduction in size critical for enabling GNN-based tracking in constrained
    computing environments. Furthermore, the IN is easily expressed as a set of matrix operations, making
    it a promising candidate for acceleration via heterogeneous computing resources.
