- doi: 10.1038/s41586-022-04892-x
  title: A portrait of the Higgs boson by the CMS experiment ten years after the discovery
  image: CMS-HIG-22-001_Figure_005-a.png
  image_width: 500
  abstract: >-
    In July 2012, the ATLAS and CMS Collaborations at the CERN Large Hadron Collider announced the observation
    of a Higgs boson at a mass of around 125 GeV. Ten years later, and with the data corresponding to
    the production of 30 times larger number of Higgs bosons, we have learnt much more about the properties
    of the Higgs boson. The CMS experiment has observed the Higgs boson in numerous fermionic and bosonic
    decay channels, established its spin-parity quantum numbers, determined its mass and measured its
    production cross sections in various modes. Here the CMS Collaboration reports the most up-to-date
    combination of results on the properties of the Higgs boson, including the most stringent limit on
    the cross section for the production of a pair of Higgs bosons, on the basis of data from proton-proton
    collisions at a centre-of-mass energy of 13 TeV. Within the uncertainties, all these observations
    are compatible with the predictions of the standard model of elementary particle physics. Much evidence
    points to the fact that the standard model is a low-energy approximation of a more comprehensive theory.
    Several of the standard model issues originate in the sector of Higgs boson physics. An order of magnitude
    larger number of Higgs bosons, expected to be examined over the next fifteen years, will help deepen
    our understanding of this crucial sector.
