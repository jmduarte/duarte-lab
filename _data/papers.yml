- doi: 10.1007/JHEP12(2020)085
  title: Inclusive search for highly boosted Higgs bosons decaying to bottom quark-antiquark pairs in
    proton-proton collisions at \(\sqrt{s}=13\) TeV
  image: CMS-HIG-19-003_Figure_003-b.png
  image_width: 500
  abstract: >-
    A search for standard model Higgs bosons (\(\mathrm{H}\)) produced with transverse momentum (\(p_\mathrm{T}\))
    greater than 450 GeV and decaying to bottom quark-antiquark pairs (\(\mathrm{b}\overline{\mathrm{b}}\))
    is performed using proton-proton collision data collected by the CMS experiment at the LHC at \(\sqrt{s}=
    13\) TeV. The data sample corresponds to an integrated luminosity of 137 fb\(^{-1}\). The search is
    inclusive in the Higgs boson production mode. Highly Lorentz-boosted Higgs bosons decaying to \(\mathrm{b}\overline{\mathrm{b}}\)
    are reconstructed as single large-radius jets, and are identified using jet substructure and a dedicated
    b tagging technique based on a deep neural network. For a Higgs boson mass of 125 GeV, an excess of
    events above the background assuming no Higgs boson production is observed with a local significance
    of 2.5 standard deviations (\(\sigma\)), while the expectation is 0.7. The corresponding signal strength
    and local significance with respect to the standard model expectation are \( \mu_\mathrm{H} = 3.7
    \pm 1.2 (\mathrm{stat}) ^{+0.6}_{-0.7} (\mathrm{syst}) ^{+0.8}_{−0.5} (\mathrm{theo})\) and \(1.9\,\sigma\).
    Additionally, an unfolded differential cross section as a function of Higgs boson \(p_\mathrm{T}\)
    for the gluon fusion production mode is presented, assuming the other production modes occur at the
    expected rates.
