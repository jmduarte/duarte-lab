- arxiv: '2606.20437'
  title: 'HEPTv2: End-to-End Efficient Point Transformer for Charged Particle Reconstruction'
  image: heptv2.png
  image_width: 500
  abstract: >-
    Charged-particle tracking -- reconstructing trajectories from sparse detector measurements -- is a
    fundamental high-energy-physics inference problem and a canonical example of learning under extreme
    combinatorial ambiguity. At the High-Luminosity Large Hadron Collider (HL-LHC), tracking must remain
    accurate and efficient despite unprecedented collision densities. Graph neural networks perform strongly,
    but incur substantial costs from graph construction and processing, while transformer-based approaches
    rely on auxiliary stages that prevent end-to-end optimization. To address this, we present HEPTv2,
    an end-to-end point-transformer architecture that reconstructs tracks from detector hits in one trainable
    pipeline. HEPTv2 combines a locality-aware point encoder with a track decoder that predicts complete
    trajectories without graph-building, clustering, or filtering. The encoder uses locality-sensitive
    hashing in detector coordinate space to preserve tracking-relevant geometry while enabling efficient
    local attention. The decoder resolves ambiguities through sectorized decoding and direct hit-to-track
    prediction under joint encoder-decoder supervision, allowing the full pipeline to be optimized end-to-end.
    On TrackML, HEPTv2 achieves 98.6% double-majority tracking efficiency at a 0.8% fake rate, while requiring
    only ~15 ms inference time and 0.4 GB peak memory per event on a NVIDIA A100 GPU. Latency and memory
    scale approximately linearly for events with up to \(5\times 10^5\) hits. HEPTv2 establishes a new
    state of the art in the accuracy-latency trade-off, improving efficiency by 4.5% over the strongest
    prior transformer and by 1.1-2.2% over optimized graph-based pipelines, while reducing latency by
    factors of 7 and 38-52, respectively. These results show end-to-end transformers can deliver the accuracy
    and efficiency required for real-time particle reconstruction at the HL-LHC.
  links:
  - label: Paper
    url: https://arxiv.org/abs/2606.20437
    text: arXiv:2606.20437
  - label: Preliminary version
    url: https://arxiv.org/abs/2510.07594
    text: arXiv:2510.07594 (ML4PS Workshop at NeurIPS 2025)
  - label: Code
    url: https://github.com/Graph-COM/HEPTv2
    text: https://github.com/Graph-COM/HEPTv2
- arxiv: '2606.14373'
  doi: 10.1103/v5n3-d3tn
  title: Machine-learned particle flow as a foundation model for collider physics
  image: MLPF_FM_paper_illustration.png
  image_width: 500
  abstract: >-
    The workflow from particle collision to physics analysis passes through a series of reconstruction
    steps that are traditionally modular and disconnected, with no shared representation linking low-level
    detector data to high-level analysis tasks. We show that casting event reconstruction as a machine
    learning problem naturally produces such a shared representation. We repurpose a machine learning
    model trained for particle-flow reconstruction (MLPF) to perform three distinct analysis tasks: jet
    flavor identification, jet energy regression, and missing momentum regression. By appending the per-particle
    latent representations learned during reconstruction as additional input features, we substantially
    improve over baselines that use kinematic features alone. We further demonstrate that a single linear
    layer trained using only the latent representations achieves competitive performance against state-of-the-art
    baseline architectures, and outperforms the baseline for missing momentum regression with approximately
    35 times fewer parameters. These results demonstrate that the latent representations learned during
    reconstruction encode essential physics information needed for downstream analysis, establishing MLPF
    as a foundation model and offering a concrete step toward an end-to-end pipeline from detector data
    to physics analysis.
  links:
  - label: Paper
    url: https://doi.org/10.1103/v5n3-d3tn
    text: PRX Intelligence 1, 023012 (2026)
  - label: Code
    url: https://github.com/jpata/particleflow
    text: https://github.com/jpata/particleflow
- arxiv: '2605.21789'
  title: Patch Hierarchical Attention Transformer for Efficient Particle Jet Tagging
  image: phatjet_patch_size_trend.png
  image_width: 500
  abstract: >-
    Real-time jet tagging is critical for identifying short-lived particle decays in the high-throughput
    detectors of the Large Hadron Collider, where real-time trigger systems responsible for deciding which
    collision events to store impose strict latency and accuracy constraints. While transformer architectures
    achieve the highest jet tagging accuracy when compute is unconstrained, their quadratic self-attention
    cost makes inference restrictive on trigger budget. Existing efficient variants reduce the computational
    cost, but hinder the classification performance. To address this limitation, we introduce the Patch
    Hierarchical Attention Transformer (PHAT-JeT), which combines two mechanisms: a physics-inspired geometric
    message-passing module that encodes local detector-plane structure, and a hierarchical patch-based
    attention scheme that computes exact attention within small particle groups while preserving global
    context through lightweight patch-token communication. Within a restricted budget, PHAT-JeT achieves
    state-of-the-art accuracy and background rejection among all resource-constrained jet tagging models
    on four benchmarks (\(\texttt{hls4ml}\), JetClass, Top Tagging, and Quark--Gluon). Our code is available
    at https://github.com/aaronw5/PHAT-JeT.
  links:
  - label: Paper
    url: https://arxiv.org/abs/2605.21789
    text: arXiv:2605.21789 (accepted to NeurIPS 2026)
  - label: Code
    url: https://github.com/aaronw5/PHAT-JeT
    text: https://github.com/aaronw5/PHAT-JeT
- arxiv: '2605.16138'
  title: 'SNAC-Pack 2.0: Scaled-Out Surrogate Neural Architecture Codesign'
  image: snac_figure_try5.png
  image_width: 500
  abstract: >-
    Neural architecture search (NAS) is a powerful approach for automating model design, but existing
    methods often optimize for accuracy alone or rely on proxy metrics such as bit operations (BOPs) that
    correlate poorly with hardware cost. This gap is particularly large for FPGA deployment, where cost
    is dominated by a multi-dimensional budget of lookup tables, DSPs, flip-flops, BRAM, and latency.
    We present the Surrogate Neural Architecture Codesign Package (SNAC-Pack), an open-source AutoML framework
    for hardware-aware neural architecture codesign and end-to-end FPGA deployment. SNAC-Pack runs a multi-objective
    global search with Optuna and NSGA-II, loading trials to a shared SQLite store that enables parallel
    workers across compute nodes. A hardware surrogate model outputs per-trial resource and latency estimates,
    avoiding the synthesis cost that would otherwise dominate the search loop. A local search stage then
    applies quantization-aware training (QAT) together with iterative magnitude pruning in a combined
    compression loop, after which the final model is synthesized to FPGA firmware via the hls4ml Python
    library. A YAML configuration and an optional agentic frontend let users run the pipeline on new datasets
    without modifying the framework. We demonstrate SNAC-Pack on jet classification at the Large Hadron
    Collider and superconducting qubit readout, discovering compact architectures that match or exceed
    strong baselines on the task metric while reducing FPGA resource utilization and, in the qubit readout
    case, reducing the design space exploration process from months of manual fine-tuning to hours of
    automated search.
  links:
  - label: Paper
    url: https://arxiv.org/abs/2605.16138
    text: arXiv:2605.16138
  - label: Preliminary version
