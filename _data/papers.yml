  abstract: >-
    We develop an algorithm based on an interaction network to identify high-momentum Higgs bosons decaying
    to bottom quark-antiquark pairs and distinguish them from ordinary jets originating from the hadronization
    of quarks and gluons. Describing the jet shower as a combination of particle-to-particle and particle-to-vertex
    interactions, the model is trained to learn a jet representation on which the classification problem
    is optimized. The algorithm is trained on simulated samples of accurate LHC collisions, released by
    the CMS collaboration on the CERN Open Data Portal. The interaction network achieves a drastic improvement
    in the identification performance with respect to state-of-the-art algorithms.
