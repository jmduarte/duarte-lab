- doi: 10.3389/frai.2021.676564
  title: 'Ps and Qs: Quantization-aware pruning for efficient low latency neural network inference'
  image: nn.png
  image_width: 500
  abstract: >-
    We explore the interplay between pruning and quantization during the training of neural networks for
    ultra low latency applications targeting high energy physics use cases. However, techniques developed
    for this study have potential application across many other domains. We study various configurations
    of pruning during quantization-aware training, which we term <em>quantization-aware pruning</em> and
    the effect of techniques like regularization, batch normalization, and different pruning schemes on
    multiple computational or neural efficiency metrics. We find that quantization-aware pruning yields
    more computationally efficient models than either pruning or quantization alone for our task. Further,
    quantization-aware pruning typically performs similar to or better in terms of computational efficiency
    compared to standard neural architecture optimization techniques. While the accuracy for the benchmark
    application may be similar, the information content of the network can vary significantly based on
    the training configuration.
