  abstract: >-
    We develop a graph generative adversarial network to generate sparse data sets like those produced
    at the CERN Large Hadron Collider (LHC). We demonstrate this approach by training on and generating
    sparse representations of MNIST handwritten digit images and jets of particles in proton-proton collisions
